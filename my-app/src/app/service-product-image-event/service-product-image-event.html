<p>service-product-image-event works!</p>
<table border="1">
    <tr>
        <td>ProductID</td>
        <td>Product Name</td>
        <td> UnitPrice</td>
        <td> Description</td>
        <td>Picture</td>
        <td>#</td>
    </tr>
    <tbody *ngFor="let p of products">
        <tr>
            <td> {{p.id}}</td>
            <td> {{p.name}}</td>
            <td> {{p.price}}</td>
            <td> {{p.description}} </td>
            <td>
                <img src="{{p.imageUrl}}">
            </td>
            <td>
                <a style="cursor:pointer;" (click)=" viewDetail(p)" title="Click here to see details">
                    Details
                </a>
            </td>
        </tr>
    </tbody>
</table>
