<app-site-header
  variant="subpage"
  positionMode="static"
  [activeNav]="activeService() === 'planning' ? 'trip-planning' : 'trip-shop'"
  [subBrand]="subBrandLabel()"
  [backLabel]="backLabel()"
  [backRoute]="resolvedBackRoute()"
  [backQueryParams]="resolvedBackQuery()"
  [backPreserveQuery]="backPreserveQuery()"
/>
<nav *ngIf="activeService() !== 'planning' && showServiceNav()" class="service-nav" aria-label="Dịch vụ du lịch">
  <ng-container *ngFor="let service of services"
    ><span
      *ngIf="service.tab === activeService(); else serviceLink"
      class="selected"
      aria-current="page"
      ><span class="material-symbols-outlined" aria-hidden="true">{{ service.icon }}</span
      >{{ service.label }}</span
    ><ng-template #serviceLink
      ><a routerLink="/trip-shop" [queryParams]="{ tab: service.tab }"
        ><span class="material-symbols-outlined" aria-hidden="true">{{ service.icon }}</span
        >{{ service.label }}</a
      ></ng-template
    ></ng-container
  >
</nav>
