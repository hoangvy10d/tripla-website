<nav aria-label="Tiến trình đặt chỗ">
  <ol>
    <li class="current" aria-current="step">
      <span class="number">1</span
      ><span
        >Thông tin đặt chỗ<small>{{
          detailsSaved() ? 'Đã lưu bản nháp' : 'Đang thực hiện'
        }}</small></span
      >
    </li>
    <li [class.current]="detailsSaved()" [attr.aria-disabled]="!detailsSaved()">
      <span class="number">2</span><span>Thanh toán<small>{{ detailsSaved() ? 'Đã xác nhận' : 'Bước tiếp theo' }}</small></span>
    </li>
    <li [class.current]="detailsSaved()" [attr.aria-disabled]="!detailsSaved()">
      <span class="number">3</span><span>Hoàn tất<small>{{ detailsSaved() ? 'Đã lưu vào hệ thống' : 'Chờ xác nhận' }}</small></span>
    </li>
  </ol>
</nav>
