<div class="actions">
  <button
    type="button"
    class="continue"
    [disabled]="disabled() || loading()"
    (click)="proceed.emit()"
  >
    {{ loading() ? 'Đang lưu…' : saved() ? 'Đã xác nhận đặt lịch ✓' : 'Xác nhận đặt lịch & Thanh toán' }}
    <span aria-hidden="true">→</span></button
  ><button type="button" class="back" [disabled]="loading()" (click)="back.emit()">
    ← {{ backLabel() }}
  </button>
</div>
