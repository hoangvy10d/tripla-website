<app-site-header
  variant="floating"
  positionMode="fixed"
  activeNav="about"
  subBrand="Về chúng tôi"
  [scrolled]="isScrolled()"
>
  <ng-container header-actions>
    <button
      class="sound"
      type="button"
      [class.on]="audio.playing()"
      (click)="audio.toggle()"
      [attr.aria-pressed]="audio.playing()"
      [attr.aria-label]="audio.playing() ? 'Tắt tiếng chim hót' : 'Bật tiếng chim hót'"
      [title]="audio.playing() ? 'Tắt tiếng chim hót' : 'Bật tiếng chim hót'"
    >
      <span class="material-symbols-outlined">{{ audio.playing() ? 'volume_up' : 'volume_off' }}</span>
    </button>

    <a class="cta" [routerLink]="tripshortCtaRoute">Trải Nghiệm TripShorts</a>
  </ng-container>

  <nav header-anchors class="about-anchors" aria-label="Điều hướng trong trang">
    @for (item of nav; track item.href) {
      <a [href]="item.href" (click)="goToSection(item.anchor, $event)">{{ item.label }}</a>
    }
  </nav>
</app-site-header>
