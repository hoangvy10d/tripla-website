  <!-- 5. Keyframes & Glassmorphism Animation -->
  <style>
    @layer base {
      html, body { margin:0; padding:0; scroll-behavior: smooth; }
      body { overscroll-behavior:none; }
    }
    ::-webkit-scrollbar { display:none; }

    /* Keyframe Animations */
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes heroBreatheGlow {
      0%, 100% { box-shadow: 0 14px 36px rgba(255, 107, 107, 0.38), 0 0 20px rgba(247, 183, 49, 0.2); transform: scale(1); }
      50% { box-shadow: 0 18px 46px rgba(255, 107, 107, 0.52), 0 0 32px rgba(247, 183, 49, 0.35); transform: scale(1.02); }
    }
    .animate-float-slow { animation: floatGentle 5s ease-in-out infinite; }
    .animate-hero-breathe { animation: heroBreatheGlow 3.6s ease-in-out infinite; }

    /* Glassmorphism Classes cho TripShorts */
    .glass-1 { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.6); }
    .glass-2 { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.9); }
    .glass-3 { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); box-shadow: 0 24px 50px -12px rgba(15, 23, 42, 0.16); }
