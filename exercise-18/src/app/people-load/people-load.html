<table border="1">

  <tr>
    <th>ID</th>
    <th>NAME</th>
    <th>EMAIL</th>
    <th>AGE</th>
    <th>#</th>
  </tr>

  @for (list of customers; track list.CustomerTypeId) {

    <tr>
      <td colspan="5">
        {{ list.CustomerTypeId }} - {{ list.CustomterTypeName }}
      </td>
    </tr>

    @for (customer of list.Customers; track customer.Id) {

      <tr>
        <td>{{ customer.Id }}</td>
        <td>{{ customer.Name }}</td>
        <td>{{ customer.Email }}</td>
        <td>{{ customer.Age }}</td>
        <td>
          <img
            [src]="customer.Image"
            [alt]="customer.Name"
            width="80">
        </td>
      </tr>

    }
  }

</table>
