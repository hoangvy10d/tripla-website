<p>category-load works!</p>
<table border="1">
    <tbody *ngFor="let category of products">
        <tr>
            <th colspan="2">Mã Danh Mục</th>
            <th colspan="2">Tên Danh Mục</th>
        </tr>
        <tr>
            <td colspan="2">{{category.Cateid}}</td>
            <td colspan="2">{{category.CateName}}</td>
        </tr>
        <tr>
            <th>Mã sản phẩm</th>
            <th>Tên sản phẩm</th>
            <th>Giá sản phẩm</th>
            <th>Picture</th>
        </tr>
        <tr *ngFor="let product of category.Products">
            <td>{{product.ProductId}}</td>
            <td>{{product.ProductName}}</td>
            <td>{{product.Price}}</td>
            <td>
                <img [src]="product.Image" [alt]="product.ProductName">
            </td>
        </tr>
    </tbody>
</table>
